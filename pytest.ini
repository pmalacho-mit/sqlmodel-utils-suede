[pytest]
testpaths = tests
# test modules are named after the module they cover,
# so collect every module under testpaths rather than
# pytest's default test_*.py / *_test.py
python_files = *.py
# `release` is importable from the repo root
pythonpath = .
addopts = -ra
# async tests need no per-test decorator
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
